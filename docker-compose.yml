# ============================================================================
# Guardrail AI - development stack
#
#   cp .env.example .env          # adjust secrets as needed
#   docker compose up --build
#
# Services:
#   db   - PostgreSQL 16 (data persisted in the `db_data` volume)
#   api  - FastAPI with uvicorn --reload; the repo is bind-mounted so edits
#          to ./app hot-reload without rebuilding.
#   web  - React frontend served by nginx on http://localhost:3000; /api
#          is reverse-proxied to the api container.
# ============================================================================

name: guardrail-ai

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-guardrail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-guardrail}
      POSTGRES_DB: ${POSTGRES_DB:-guardrail}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-guardrail} -d ${POSTGRES_DB:-guardrail}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-guardrail}:${POSTGRES_PASSWORD:-guardrail}@db:5432/${POSTGRES_DB:-guardrail}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_JSON: ${LOG_JSON:-true}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      PROMETHEUS_ENABLED: ${PROMETHEUS_ENABLED:-true}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://localhost:4318}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-guardrail-ai}
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - .:/workspace
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data:
