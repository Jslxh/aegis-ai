service: aegis-ai

frameworkVersion: '3'

useDotenv: true

provider:
  name: aws
  runtime: python3.12
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  timeout: 30
  memorySize: 1024
  environment:
    DATABASE_URL: ${env:DATABASE_URL, ''}
    GROQ_API_KEY: ${env:GROQ_API_KEY, ''}
    SMTP_SERVER: ${env:SMTP_SERVER, ''}
    SMTP_PORT: ${env:SMTP_PORT, ''}
    SMTP_USER: ${env:SMTP_USER, ''}
    SMTP_PASSWORD: ${env:SMTP_PASSWORD, ''}
    INTERNAL_DOMAIN: ${env:INTERNAL_DOMAIN, '@company.com'}

  ecr:
    images:
      appimage:
        path: ./
        file: Dockerfile.lambda

functions:
  api:
    image:
      name: appimage
    events:
      - httpApi:
          path: /{proxy+}
          method: '*'
      - httpApi:
          path: /
          method: '*'
